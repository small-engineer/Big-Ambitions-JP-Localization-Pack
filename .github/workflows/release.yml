name: Release to Steam Workshop

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: steam-workshop
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify generated localization
        run: |
          python3 build.py --check
          python3 build_workshop.py --check

      - name: Prepare Workshop content
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/workshop-content/Locales"
          gh release download "$RELEASE_TAG" \
            --pattern BigAmbitions.JpLocalizationPack.dll \
            --dir "$RUNNER_TEMP/workshop-content"
          cp Locales/ja.json "$RUNNER_TEMP/workshop-content/Locales/ja.json"
          cp thumbnail.png "$RUNNER_TEMP/workshop-content/thumbnail.png"

      - name: Set up SteamCMD
        id: steamcmd
        uses: andriivitiv/setup-steamcmd@afc45f145b95c175c3a3862d3ca84756537d48e8 # v1

      - name: Upload to Steam Workshop
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          STEAMCMD_EXECUTABLE: ${{ steps.steamcmd.outputs.executable }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          WORKSHOP_ITEM_ID: ${{ vars.STEAM_WORKSHOP_ITEM_ID }}
        run: |
          set -euo pipefail

          [[ "$WORKSHOP_ITEM_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "STEAM_WORKSHOP_ITEM_ID must be a numeric repository variable."
            exit 1
          }
          [[ -n "$STEAM_USERNAME" ]] || {
            echo "STEAM_USERNAME repository secret is missing."
            exit 1
          }
          [[ -n "$STEAM_PASSWORD" ]] || {
            echo "STEAM_PASSWORD repository secret is missing."
            exit 1
          }
          [[ -n "$STEAM_CONFIG_VDF" ]] || {
            echo "STEAM_CONFIG_VDF repository secret is missing."
            exit 1
          }

          mkdir -p "$HOME/Steam/config"
          printf '%s' "$STEAM_CONFIG_VDF" | base64 --decode > "$HOME/Steam/config/config.vdf"
          chmod 600 "$HOME/Steam/config/config.vdf"
          trap 'rm -f "$HOME/Steam/config/config.vdf"' EXIT

          python3 build_workshop.py \
            --vdf "$RUNNER_TEMP/workshop.vdf" \
            --published-file-id "$WORKSHOP_ITEM_ID" \
            --content-folder "$RUNNER_TEMP/workshop-content" \
            --preview-file "$RUNNER_TEMP/workshop-content/thumbnail.png" \
            --change-note "GitHub Release $RELEASE_TAG"

          "$STEAMCMD_EXECUTABLE" \
            +@ShutdownOnFailedCommand 1 \
            +@NoPromptForPassword 1 \
            +login "$STEAM_USERNAME" "$STEAM_PASSWORD" \
            +workshop_build_item "$RUNNER_TEMP/workshop.vdf" \
            +quit | tee "$RUNNER_TEMP/steamcmd.log"

          grep -q 'Success\.' "$RUNNER_TEMP/steamcmd.log" || {
            echo "SteamCMD did not report a successful Workshop update."
            exit 1
          }
